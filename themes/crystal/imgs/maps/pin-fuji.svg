<svg width="100%" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pin Fuji, versione ad alto contrasto per uso in miniatura</title>
<desc>Un'icona pin circolare con anello dorato spesso, bordo scuro esterno per contrasto, interno beige chiaro, kanji grande al centro, punta inferiore, su sfondo trasparente.</desc>
<defs>
<linearGradient id="goldGradB" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#f8e3a0"/>
<stop offset="50%" stop-color="#d4a82f"/>
<stop offset="100%" stop-color="#96731a"/>
</linearGradient>
<linearGradient id="beigeGradB" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#faf3e0"/>
<stop offset="100%" stop-color="#ecd9ac"/>
</linearGradient>
</defs>

<polygon points="292,330 388,330 340,500" fill="#1a1206"/>
<polygon points="300,332 380,332 340,486" fill="url(#goldGradB)"/>
<polygon points="314,332 366,332 340,450" fill="url(#beigeGradB)"/>

<circle cx="340" cy="230" r="182" fill="none" stroke="#f8e3a0" stroke-width="3" stroke-dasharray="10 9" opacity="0.85"/>

<circle cx="340" cy="230" r="168" fill="#1a1206"/>
<circle cx="340" cy="230" r="158" fill="url(#goldGradB)"/>
<circle cx="340" cy="230" r="130" fill="url(#beigeGradB)"/>
<circle cx="340" cy="230" r="130" fill="none" stroke="#96731a" stroke-width="3"/>

<g fill="none" stroke="#f8e3a0" stroke-width="4" opacity="0.9">
<circle cx="340" cy="72" r="6"/>
<circle cx="340" cy="388" r="6"/>
<circle cx="182" cy="230" r="6"/>
<circle cx="498" cy="230" r="6"/>
</g>
<g stroke="#96731a" stroke-width="3" opacity="0.9">
<line x1="340" y1="72" x2="340" y2="102"/>
<line x1="340" y1="358" x2="340" y2="388"/>
<line x1="182" y1="230" x2="212" y2="230"/>
<line x1="468" y1="230" x2="498" y2="230"/>
</g>

<text x="340" y="266" text-anchor="middle" font-size="120" fill="#241a08" stroke="#5c440f" stroke-width="3" paint-order="stroke fill" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">富士</text>

<circle cx="340" cy="230" r="158" fill="none" stroke="#5c440f" stroke-width="2"/>
</svg>
