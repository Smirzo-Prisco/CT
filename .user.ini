; Hardening cookie di sessione PHP (letto da php-fpm, nessun riavvio richiesto
; - user_ini.cache_ttl default 300s prima che venga ri-letto).
;
; httponly: il cookie PHPSESSID non e' piu' leggibile da JavaScript
; (document.cookie) — blocca l'esfiltrazione della sessione via script
; iniettato (es. XSS stored), anche se lo script riesce comunque a eseguire
; azioni autenticate finche' resta sulla pagina (il filtro HTML va comunque
; mantenuto, questo e' un livello di difesa aggiuntivo, non sostitutivo).
; secure: il cookie viene inviato solo su HTTPS (il sito gira solo su https).
; samesite=Lax: non viene inviato in richieste cross-site iniziate da terzi
; (coerente con il cookie device_id, che usa già Lax).
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
