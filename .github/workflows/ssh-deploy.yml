name: Deploy GDRCD su Crystal Tokyo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy su server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SSH_PATH }}
            # Preserva config.inc.php prima del reset (non è in git)
            cp config.inc.php /tmp/ct_config_backup.php 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # Ripristina config.inc.php dopo il reset
            cp /tmp/ct_config_backup.php config.inc.php 2>/dev/null || true
            cd ${{ secrets.SSH_PATH }}/nodeserver
            npm install --production
            pm2 restart ct-socket || pm2 start server.js --name ct-socket
            cd ${{ secrets.SSH_PATH }}/frontend
            npm install
            npm run build:css
            npm run build
            chown -R www-data:www-data /var/www/crystaltokyo